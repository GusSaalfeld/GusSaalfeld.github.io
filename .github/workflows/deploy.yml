# Builds the site to static files and publishes them to GitHub Pages.
# It only runs when started by hand: on GitHub, Actions > Deploy to GitHub Pages > Run workflow.
# To publish on every push to main instead, add under `on:`
#   push:
#     branches: [main]
name: Deploy to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer one waits rather than cancelling one in progress
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # matches local development; the portfolio PDF script runs TypeScript directly
          cache: npm
      - run: npm ci
      - run: npm run build # builds the portfolio PDF from the samples, then writes the site to out/ (next.config.ts sets output: "export")
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
